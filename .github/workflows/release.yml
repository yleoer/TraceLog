name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  NODE_VERSION: "24"
  WAILS_VERSION: v2.10.2

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || format('run-{0}', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION"
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test Go packages
        run: go test ./...

      - name: Build Wails package
        shell: pwsh
        run: |
          wails build -clean -trimpath -platform windows/amd64 -ldflags "-X tracelog/internal/desktop.AppVersion=$env:RELEASE_LABEL" -nsis -webview2 embed

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem -Path build/bin -Filter "*installer.exe" -File | Select-Object -First 1
          if (-not $installer) {
            Get-ChildItem -Path build/bin -Recurse | Format-Table FullName, Length
            throw "NSIS installer was not produced."
          }
          Copy-Item -LiteralPath $installer.FullName -Destination "release/TraceLog-$env:RELEASE_LABEL-windows-amd64-installer.exe" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: TraceLog-${{ env.RELEASE_LABEL }}-windows-amd64
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $notesFile = Join-Path "release-notes" "$env:TAG_NAME.md"
          $viewArgs = @("release", "view", $env:TAG_NAME, "--repo", $env:GH_REPO)
          & gh @viewArgs *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          $releaseArgs = $null
          if (Test-Path -LiteralPath $notesFile) {
            if ($releaseExists) {
              $releaseArgs = @("release", "edit", $env:TAG_NAME, "--repo", $env:GH_REPO, "--title", $env:TAG_NAME, "--notes-file", $notesFile)
            else
              $releaseArgs = @("release", "create", $env:TAG_NAME, "--repo", $env:GH_REPO, "--title", $env:TAG_NAME, "--notes-file", $notesFile)
            }
          } elseif (-not $releaseExists) {
            $releaseArgs = @("release", "create", $env:TAG_NAME, "--repo", $env:GH_REPO, "--title", $env:TAG_NAME, "--generate-notes")
          }

          if ($null -ne $releaseArgs) {
            $releaseExitCode = 1
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & gh @releaseArgs
              $releaseExitCode = $LASTEXITCODE
              if ($releaseExitCode -eq 0) {
                break
              }
              if ($attempt -lt 3) {
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if ($releaseExitCode -ne 0) {
              throw "Failed to create or update GitHub Release $env:TAG_NAME (exit code $releaseExitCode)."
            }
          }

          $assets = Get-ChildItem -Path release-assets -File -Recurse
          if (-not $assets) {
            throw "No release assets were downloaded."
          }
          foreach ($asset in $assets) {
            $uploadArgs = @("release", "upload", $env:TAG_NAME, $asset.FullName, "--repo", $env:GH_REPO, "--clobber")
            & gh @uploadArgs
            $uploadExitCode = $LASTEXITCODE
            if ($uploadExitCode -ne 0) {
              throw "Failed to upload release asset $($asset.FullName) (exit code $uploadExitCode)."
            }
          }
