name: Release Builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { throw 'Root dependency installation failed.' }
          npm.cmd --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed.' }
      - name: Validate tag and release notes
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and Tauri version must match.' }
          $notes = "release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes) -or -not (Get-Content -LiteralPath $notes -Raw).Trim()) { throw 'Release notes are required.' }
      - name: Check Rust and release manifest generation
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting check failed.' }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
          node --test scripts/prepare-release.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release manifest tests failed.' }
      - name: Test actual WebView and native IPC
        shell: pwsh
        run: ./scripts/test-desktop.ps1 -RunRoot "$env:RUNNER_TEMP/TraceLog-desktop-smoke-$env:GITHUB_RUN_ID"
      - name: Preserve desktop test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TraceLog-desktop-test-diagnostics
          path: |
            ${{ runner.temp }}/TraceLog-desktop-smoke-*/data/desktop-smoke.json
            ${{ runner.temp }}/TraceLog-desktop-smoke-*/data/logs/*
          if-no-files-found: ignore
      - name: Build Tauri NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and -not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Release requires TAURI_SIGNING_PRIVATE_KEY.' }
          $signed = [bool]$env:TAURI_SIGNING_PRIVATE_KEY
          $config = Join-Path $env:RUNNER_TEMP 'tracelog-ci.json'
          @{bundle = @{createUpdaterArtifacts = $signed}} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $config
          npm.cmd run tauri -- build --ci --config $config
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed.' }
      - name: Prepare complete release assets
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/prepare-release.mjs $env:GITHUB_REF_NAME $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release manifest generation failed.' }
          } else {
            New-Item -ItemType Directory -Path release | Out-Null
            Copy-Item -Path target/release/bundle/nsis/*-setup.exe* -Destination release
          }
      - uses: actions/upload-artifact@v7
        with:
          name: TraceLog-windows-amd64
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish complete signed release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: TraceLog-windows-amd64
          path: release
      - name: Upload all assets to draft, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content release/latest.json -Raw | ConvertFrom-Json
          if ("v$($manifest.version)" -ne $env:TAG_NAME) { throw 'Manifest version does not match tag.' }
          $files = @(Get-ChildItem -LiteralPath release -File)
          if ($files.Count -ne 3) { throw 'Installer, signature and manifest are all required.' }
          $existing = gh release view $env:TAG_NAME --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Published releases cannot be overwritten.' }
          } else {
            gh release create $env:TAG_NAME --draft --verify-tag --title "TraceLog $env:TAG_NAME" --notes-file "release-notes/$env:TAG_NAME.md"
            if ($LASTEXITCODE -ne 0) { throw 'Creating draft release failed.' }
          }
          gh release upload $env:TAG_NAME @($files.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading release assets failed; draft is retained.' }
          $uploaded = gh release view $env:TAG_NAME --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Reading uploaded assets failed.' }
          foreach ($file in $files) {
            $asset = @($uploaded.assets | Where-Object { $_.name -eq $file.Name -and $_.size -eq $file.Length })
            if ($asset.Count -ne 1) { throw "Uploaded asset is incomplete: $($file.Name)" }
          }
          if ($env:TAG_NAME.Contains('-')) {
            gh release edit $env:TAG_NAME --draft=false --prerelease --latest=false --notes-file "release-notes/$env:TAG_NAME.md"
          } else {
            gh release edit $env:TAG_NAME --draft=false --latest --notes-file "release-notes/$env:TAG_NAME.md"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed.' }
