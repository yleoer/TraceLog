[package]
name = "tracelog"
version = "0.2.0"
description = "TraceLog desktop work journal"
authors = ["yleoer"]
edition = "2021"
default-run = "TraceLog"

[[bin]]
name = "TraceLog"
path = "src/main.rs"

[features]
update-e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
